<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근무 관리 사이트</title>
    <style>
        :root {
            --bg-color: #f1f5f9; 
            --text-color: #334155; 
            --section-bg: #ffffff;
            --border-color: #cbd5e1;
            --th-bg: #f8fafc;
            --input-bg: #ffffff;
            
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --accent: #475569; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
        }

        body.dark-mode {
            --bg-color: #0f172a; 
            --text-color: #f8fafc;
            --section-bg: #1e293b;
            --border-color: #334155;
            --th-bg: #0f172a;
            --input-bg: #0f172a;
            
            --primary: #3b82f6;
            --accent: #64748b;
        }

        body { 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            padding: 20px; 
            max-width: 900px; 
            margin: auto; 
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        #loginOverlay { background-color: var(--bg-color); backdrop-filter: none; }

        .login-box {
            background: var(--section-bg); padding: 40px; border-radius: 12px;
            text-align: center; border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 320px;
        }

        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-area h2 { margin: 0; font-weight: 600; color: var(--text-color); }
        
        .section-box { 
            background: var(--section-bg); padding: 25px; border-radius: 12px; 
            margin-bottom: 25px; border: 1px solid var(--border-color); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .section-title { font-size: 1.1em; font-weight: bold; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .time-inputs { display: flex; gap: 10px; margin: 10px 0; align-items: center; }
        .time-select-group { display: flex; gap: 5px; flex: 1; }
        
        input, select, button { 
            padding: 10px 12px; margin: 5px 0; width: 100%; box-sizing: border-box; 
            border: 1px solid var(--border-color); border-radius: 6px;
            background-color: var(--input-bg); color: var(--text-color);
            outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); }
        .time-select-group select { padding: 8px; }
        input[type="file"] { padding: 8px; background: transparent; border: 1px dashed var(--border-color); cursor: pointer; }

        button { cursor: pointer; transition: all 0.2s; font-weight: 500; }
        button:active { transform: scale(0.98); } 
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-save { background: var(--primary); color: white; border: none; }
        .btn-save:hover { background: var(--primary-hover); }
        .btn-print { background: var(--accent); color: white; border: none; }
        .btn-theme { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); width: auto; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
        .btn-edit { background: var(--warning); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; margin-right: 5px; font-size: 0.85em; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.85em; }
        .btn-cancel { background: var(--accent); color: white; border: none; display: none; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header button { width: auto; padding: 5px 15px; background: transparent; border: 1px solid var(--border-color); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .cal-day-header { font-weight: bold; color: var(--accent); font-size: 0.85em; padding-bottom: 5px; }
        .cal-day { padding: 12px 0; border-radius: 8px; background: var(--th-bg); border: 1px solid var(--border-color); font-size: 0.95em; }
        .cal-day.recorded { background: var(--primary); color: white; font-weight: bold; border: none; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3); }
        .cal-day.empty { background: transparent; border: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        th, td { border: 1px solid var(--border-color); padding: 12px 10px; text-align: center; }
        th { background: var(--th-bg); white-space: nowrap; font-weight: 600; }
        
        .file-link { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 0.9em; }
        .file-link:hover { text-decoration: underline; }

        .print-only { display: none; }

        /* 인쇄 전용 스타일 */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { padding: 0; background-color: white !important; color: black !important; } 
            .section-box { border: none; box-shadow: none; padding: 0; margin-bottom: 20px; }
            table { border: 2px solid #000; }
            th, td { border: 1px solid #000; }
            th { background-color: #eee !important; -webkit-print-color-adjust: exact; }
            
            /* 인쇄 시 나타나는 서명란 스타일 */
            .print-signature { margin-top: 50px; text-align: right; font-size: 1.1em; line-height: 2; }
            .print-signature .date-text { margin-bottom: 20px; margin-right: 20px; }
            .print-signature .sign-text { font-weight: bold; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 style="margin-top:0;">근무 관리 사이트</h2>
            <p style="margin-bottom:20px; font-size:14px; color:var(--accent);">접속하려면 비밀번호를 입력하세요.</p>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()" class="btn-save" style="margin-top:10px;">접속하기</button>
        </div>
    </div>

    <div id="actionPwOverlay" class="login-overlay" style="display: none;">
        <div class="login-box">
            <h3 style="margin-top:0;" id="actionPwTitle">비밀번호 확인</h3>
            <input type="password" id="actionPwInput" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') confirmActionPw()">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="confirmActionPw()" class="btn-save" style="flex:1;">확인</button>
                <button onclick="closeActionPw()" class="btn-cancel" style="display:block; flex:1;">취소</button>
            </div>
        </div>
    </div>

    <div class="header-area no-print">
        <h2>근무 관리 사이트</h2>
        <button id="themeToggle" class="btn-theme">다크모드</button>
    </div>

    <!-- 1. 근무 내역 입력 (가장 위로 이동) -->
    <div class="section-box no-print">
        <h3 class="section-title">근무 내역 입력</h3>
        <input type="date" id="workDate">
        
        <div class="time-inputs">
            <div class="time-select-group">
                <select id="startAmPm"><option value="오전">오전</option><option value="오후">오후</option></select>
                <select id="startHour" title="시"></select>
                <select id="startMinute" title="분"></select>
            </div>
            <span style="color: var(--accent);">~</span>
            <div class="time-select-group">
                <select id="endAmPm"><option value="오전">오전</option><option value="오후">오후</option></select>
                <select id="endHour" title="시"></select>
                <select id="endMinute" title="분"></select>
            </div>
        </div>
        
        <input type="text" id="workContent" placeholder="근무 내용">
        
        <div style="margin-top: 15px;">
            <label style="font-size: 0.9em; font-weight: bold; color: var(--accent); display: block; margin-bottom: 5px;">증빙 서류 첨부 (선택 사항)</label>
            <div id="currentFileDisplay" style="font-size: 0.85em; color: var(--primary); display: none; margin-bottom: 5px;"></div>
            <input type="file" id="workFile" accept=".pdf, image/*">
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="saveBtn" class="btn-save">확인 (저장)</button>
            <button id="cancelEditBtn" class="btn-cancel">수정 취소</button>
            <button onclick="window.print()" class="btn-print">내역 인쇄하기</button>
        </div>
    </div>

    <!-- 2. 근무 출결 대장 (가운데로 이동) -->
    <div class="section-box" style="padding-top: 10px;">
        <h3 class="section-title no-print" style="margin-top: 15px;">근무 출결 대장</h3>
        <table>
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>근무 시간</th>
                    <th>근무 내용</th>
                    <th class="no-print">첨부파일</th> <!-- 인쇄 시 안 보임 -->
                    <th class="no-print" style="width: 110px;">관리</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
            </tbody>
        </table>
        
        <!-- 인쇄 시 나타나는 한 달 치 공통 결재(서명)란 -->
        <div class="print-signature print-only">
            <div>위의 근무 내역이 사실임을 확인합니다.</div>
            <div class="date-text">20&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;년&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;일</div>
            <div class="sign-text">연구책임자 : &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(서명)</div>
        </div>
    </div>

    <!-- 3. 월간 출결 현황 (가장 아래로 이동) -->
    <div class="section-box no-print">
        <h3 class="section-title">월간 출결 현황</h3>
        <div class="calendar-header">
            <button id="prevMonthBtn">&lt; 이전</button>
            <strong id="calendarMonthText" style="font-size: 1.1em;"></strong>
            <button id="nextMonthBtn">다음 &gt;</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, orderBy, query } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ3AZrepQIANDKjI1yhcqmAjF-2g0U6jc",
            authDomain: "practice-34277.firebaseapp.com",
            projectId: "practice-34277",
            storageBucket: "practice-34277.firebasestorage.app",
            messagingSenderId: "997513375348",
            appId: "1:997513375348:web:a5d1d869ee25dec53feb21"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app); 

        let globalRecords = {}; 
        let currentEditId = null;
        let pendingAction = null; 
        let pendingData = null;   
        
        let currentFileUrl = null;
        let currentFilePath = null;
        let currentFileName = null;
        
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth(); 
        let recordedDates = new Set(); 

        document.getElementById('workDate').valueAsDate = new Date();

        function checkPassword(input) {
            let h = 0;
            for (let i = 0; i < input.length; i++) {
                h = ((h << 5) - h) + input.charCodeAt(i);
                h = h & h; 
            }
            return h.toString(16) === "177ce3";
        }

        function populateTimeSelects() {
            const hours = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
            const minutes = ['00', '10', '20', '30', '40', '50'];
            
            const startHour = document.getElementById('startHour');
            const endHour = document.getElementById('endHour');
            const startMinute = document.getElementById('startMinute');
            const endMinute = document.getElementById('endMinute');

            hours.forEach(h => { startHour.add(new Option(h, h)); endHour.add(new Option(h, h)); });
            minutes.forEach(m => { startMinute.add(new Option(m, m)); endMinute.add(new Option(m, m)); });
        }
        
        function setDefaultTime() {
            document.getElementById('startAmPm').value = '오전'; document.getElementById('startHour').value = '08'; document.getElementById('startMinute').value = '30';
            document.getElementById('endAmPm').value = '오후'; document.getElementById('endHour').value = '06'; document.getElementById('endMinute').value = '00';
        }

        populateTimeSelects();
        setDefaultTime();

        window.login = () => {
            const pw = document.getElementById('loginPw').value;
            if (checkPassword(pw)) {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                alert('비밀번호가 틀렸습니다.');
                document.getElementById('loginPw').value = '';
                document.getElementById('loginPw').focus();
            }
        };

        const themeBtn = document.getElementById('themeToggle');
        if (localStorage.getItem('themePref') === 'dark') {
            document.body.classList.add('dark-mode');
            themeBtn.textContent = '라이트모드';
        }
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = '라이트모드'; localStorage.setItem('themePref', 'dark');
            } else {
                themeBtn.textContent = '다크모드'; localStorage.setItem('themePref', 'light');
            }
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const date = document.getElementById('workDate').value;
            const content = document.getElementById('workContent').value;
            
            const stAmPm = document.getElementById('startAmPm').value; const stHr = document.getElementById('startHour').value; const stMin = document.getElementById('startMinute').value;
            const edAmPm = document.getElementById('endAmPm').value; const edHr = document.getElementById('endHour').value; const edMin = document.getElementById('endMinute').value;

            if(!date || !content) {
                alert("모든 내용을 입력해주세요.");
                return;
            }

            const hours = `${stAmPm} ${stHr}:${stMin} ~ ${edAmPm} ${edHr}:${edMin}`;
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.textContent = '저장 중...';
            saveBtn.disabled = true;

            try {
                const fileInput = document.getElementById('workFile');
                const file = fileInput.files[0];
                
                let finalFileUrl = currentFileUrl;
                let finalFilePath = currentFilePath;
                let finalFileName = currentFileName;

                if (file) {
                    if (currentFilePath) {
                        const oldRef = ref(storage, currentFilePath);
                        deleteObject(oldRef).catch(e => console.log(e)); 
                    }
                    
                    finalFilePath = 'attachments/' + Date.now() + '_' + file.name;
                    const storageRef = ref(storage, finalFilePath);
                    const snapshot = await uploadBytes(storageRef, file);
                    finalFileUrl = await getDownloadURL(snapshot.ref);
                    finalFileName = file.name;
                }

                const recordData = { 
                    date: date, hours: hours, content: content,
                    fileUrl: finalFileUrl, filePath: finalFilePath, fileName: finalFileName,
                    timestamp: new Date()
                };

                if (currentEditId) {
                    await updateDoc(doc(db, "workRecords", currentEditId), recordData);
                    resetInputForm();
                } else {
                    await addDoc(collection(db, "workRecords"), recordData);
                    document.getElementById('workContent').value = ''; 
                    document.getElementById('workFile').value = '';
                }
                loadData();
            } catch (e) {
                console.error("저장 오류: ", e);
                alert("처리 중 오류가 발생했습니다. Storage 권한을 확인해주세요.");
            } finally {
                saveBtn.textContent = '확인 (저장)';
                saveBtn.disabled = false;
            }
        });

        async function loadData() {
            const q = query(collection(db, "workRecords"), orderBy("date", "desc"));
            const querySnapshot = await getDocs(q);
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';
            
            globalRecords = {}; 
            recordedDates.clear(); 

            querySnapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const id = documentSnapshot.id;
                
                globalRecords[id] = data; 
                recordedDates.add(data.date); 
                
                let fileLinkHtml = data.fileUrl 
                    ? `<a href="${data.fileUrl}" target="_blank" class="file-link" title="${data.fileName}">💾 다운로드</a>` 
                    : '<span style="color:var(--border-color);">-</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.date}</td>
                    <td>${data.hours}</td>
                    <td>${data.content}</td>
                    <td class="no-print">${fileLinkHtml}</td> <!-- 인쇄 시 안 보임 -->
                    <td class="no-print">
                        <button class="btn-edit" onclick="editRecordBtn('${id}')">수정</button>
                        <button class="btn-delete" onclick="deleteRecordBtn('${id}')">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            renderCalendar(); 
        }

        function renderCalendar() {
            document.getElementById('calendarMonthText').textContent = `${calYear}년 ${calMonth + 1}월`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const days = ['일', '월', '화', '수', '목', '금', '토'];
            days.forEach(d => {
                let div = document.createElement('div'); div.className = 'cal-day-header'; div.textContent = d; grid.appendChild(div);
            });

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                let div = document.createElement('div'); div.className = 'cal-day empty'; grid.appendChild(div);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                let div = document.createElement('div'); div.className = 'cal-day'; div.textContent = i;
                let checkMonth = String(calMonth + 1).padStart(2, '0'); let checkDay = String(i).padStart(2, '0');
                let fullDate = `${calYear}-${checkMonth}-${checkDay}`;

                if (recordedDates.has(fullDate)) div.classList.add('recorded');
                grid.appendChild(div);
            }
        }

        document.getElementById('prevMonthBtn').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
        document.getElementById('nextMonthBtn').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });

        window.editRecordBtn = (id) => {
            pendingAction = 'edit'; pendingData = id;
            document.getElementById('actionPwTitle').textContent = '수정 비밀번호';
            document.getElementById('actionPwInput').value = ''; document.getElementById('actionPwOverlay').style.display = 'flex'; document.getElementById('actionPwInput').focus();
        };

        window.deleteRecordBtn = (id) => {
            pendingAction = 'delete'; pendingData = id;
            document.getElementById('actionPwTitle').textContent = '삭제 비밀번호';
            document.getElementById('actionPwInput').value = ''; document.getElementById('actionPwOverlay').style.display = 'flex'; document.getElementById('actionPwInput').focus();
        };

        window.closeActionPw = () => { document.getElementById('actionPwOverlay').style.display = 'none'; pendingAction = null; pendingData = null; };

        window.confirmActionPw = async () => {
            const pw = document.getElementById('actionPwInput').value;
            if (checkPassword(pw)) {
                const actionToPerform = pendingAction; const targetId = pendingData;
                closeActionPw(); 
                
                if (actionToPerform === 'edit') {
                    executeEdit(targetId);
                } else if (actionToPerform === 'delete') {
                    await executeDelete(targetId);
                }
            } else {
                alert("비밀번호가 일치하지 않습니다."); document.getElementById('actionPwInput').value = ''; document.getElementById('actionPwInput').focus();
            }
        };

        function executeEdit(id) {
            const data = globalRecords[id];
            if(!data) return;

            document.getElementById('workDate').value = data.date;
            document.getElementById('workContent').value = data.content;
            
            const [stPart, edPart] = data.hours.split(' ~ ');
            if (stPart && edPart) { parseAndSetTime(stPart, 'start'); parseAndSetTime(edPart, 'end'); } else { setDefaultTime(); }

            currentFileUrl = data.fileUrl || null;
            currentFilePath = data.filePath || null;
            currentFileName = data.fileName || null;
            
            const fileDisp = document.getElementById('currentFileDisplay');
            if (currentFileUrl) {
                fileDisp.style.display = 'block';
                fileDisp.innerHTML = `현재 파일: <a href="${currentFileUrl}" target="_blank">${currentFileName}</a> (새 파일 업로드 시 교체됨)`;
            } else {
                fileDisp.style.display = 'none';
            }

            currentEditId = id;
            document.getElementById('saveBtn').textContent = '수정 완료';
            document.getElementById('cancelEditBtn').style.display = 'block'; 
            window.scrollTo(0, 0); 
        }

        function parseAndSetTime(timeStr, type) {
            let ampm = '오전'; let hr = '08'; let min = '00';
            if (timeStr.includes('오전') || timeStr.includes('오후')) {
                const parts = timeStr.split(' '); ampm = parts[0]; [hr, min] = parts[1].split(':');
            } else { 
                let [h, m] = timeStr.split(':'); let hNum = parseInt(h, 10);
                if (hNum >= 12) { ampm = '오후'; if (hNum > 12) hNum -= 12; } else { ampm = '오전'; if (hNum === 0) hNum = 12; }
                hr = hNum.toString().padStart(2, '0'); min = m;
            }
            document.getElementById(type + 'AmPm').value = ampm; document.getElementById(type + 'Hour').value = hr; document.getElementById(type + 'Minute').value = min;
        }

        async function executeDelete(id) {
            const data = globalRecords[id];
            if(confirm("정말 삭제하시겠습니까?")) {
                if (data && data.filePath) {
                    const fileRef = ref(storage, data.filePath);
                    await deleteObject(fileRef).catch(e => console.log("파일 삭제 생략:", e));
                }
                await deleteDoc(doc(db, "workRecords", id));
                loadData();
            }
        }

        document.getElementById('cancelEditBtn').addEventListener('click', () => { resetInputForm(); });

        function resetInputForm() {
            currentEditId = null;
            currentFileUrl = null; currentFilePath = null; currentFileName = null;
            document.getElementById('currentFileDisplay').style.display = 'none';
            document.getElementById('workFile').value = '';
            
            document.getElementById('saveBtn').textContent = '확인 (저장)';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('workContent').value = '';
            document.getElementById('workDate').valueAsDate = new Date();
            setDefaultTime();
        }

        loadData();
    </script>
</body>
</html>
