<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 출결 관리</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --section-bg: #f4f4f4;
            --border-color: #ccc;
            --th-bg: #eee;
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --section-bg: #1e1e1e;
            --border-color: #444;
            --th-bg: #333;
            --input-bg: #2c2c2c;
        }

        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: var(--section-bg); padding: 40px; border-radius: 12px;
            text-align: center; border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-area { display: flex; justify-content: space-between; align-items: center; }
        .input-section { background: var(--section-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        
        .time-inputs { display: flex; gap: 10px; margin: 5px 0; }
        .time-inputs input, .time-inputs select { flex: 1; }
        
        /* select(드롭다운) 디자인 추가 */
        input, select, button { 
            padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; 
            border: 1px solid var(--border-color); border-radius: 4px;
            background-color: var(--input-bg); color: var(--text-color);
        }

        button { cursor: pointer; transition: transform 0.1s, filter 0.1s; }
        button:active { transform: scale(0.97); filter: brightness(0.9); } 

        .btn-save { background: #28a745; color: white; border: none; font-weight: bold; }
        .btn-print { background: #007bff; color: white; border: none; font-weight: bold; }
        .btn-theme { background: #6c757d; color: white; border: none; width: auto; padding: 10px 20px; border-radius: 20px; }
        .btn-edit { background: #ffc107; color: black; border: none; padding: 5px 10px; border-radius: 4px; margin-right: 5px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; }
        .btn-cancel { background: #6c757d; color: white; border: none; font-weight: bold; display: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
        th { background: var(--th-bg); }
        
        .print-only { display: none; }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: table-cell !important; }
            body { padding: 0; background-color: white !important; color: black !important; } 
            table { border: 2px solid #000; }
            th, td { border: 1px solid #000; }
            th { background-color: #eee !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2 style="margin-top:0;">출결 관리 시스템</h2>
            <p style="margin-bottom:20px; font-size:14px; color:gray;">접속하려면 비밀번호를 입력하세요.</p>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()" class="btn-save" style="margin-top:10px;">접속하기</button>
        </div>
    </div>

    <div class="header-area no-print">
        <h2>근무 출결 기록</h2>
        <button id="themeToggle" class="btn-theme">다크모드</button>
    </div>

    <div class="input-section no-print">
        <input type="date" id="workDate">
        
        <!-- 변경: 10분 단위 선택을 강제하는 select 드롭다운으로 교체 -->
        <div class="time-inputs">
            <select id="startTime" title="시작 시간"></select>
            <span style="display:flex; align-items:center;">~</span>
            <select id="endTime" title="종료 시간"></select>
        </div>
        
        <input type="text" id="workContent" placeholder="근무 내용">
        
        <button id="saveBtn" class="btn-save">확인 (저장)</button>
        <button id="cancelEditBtn" class="btn-cancel">수정 취소</button>
        <button onclick="window.print()" class="btn-print">내역 인쇄하기</button>
    </div>

    <h2>근무 출결 대장</h2>
    <table>
        <thead>
            <tr>
                <th>날짜</th>
                <th>근무 시간</th>
                <th>근무 내용</th>
                <th class="print-only" style="width: 120px;">연구책임자 확인</th>
                <th class="no-print">관리</th>
            </tr>
        </thead>
        <tbody id="recordTableBody">
            <!-- 데이터 표시 영역 -->
        </tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, orderBy, query } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 알려주신 설정값 완벽 적용
        const firebaseConfig = {
            apiKey: "AIzaSyCQ3AZrepQIANDKjI1yhcqmAjF-2g0U6jc",
            authDomain: "practice-34277.firebaseapp.com",
            projectId: "practice-34277",
            storageBucket: "practice-34277.firebasestorage.app",
            messagingSenderId: "997513375348",
            appId: "1:997513375348:web:a5d1d869ee25dec53feb21"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentEditId = null;

        document.getElementById('workDate').valueAsDate = new Date();

        // JS 추가: 10분 단위 시간 옵션을 드롭다운에 자동으로 채워주는 함수
        function generateTimeOptions(selectId, defaultTime) {
            const selectElement = document.getElementById(selectId);
            for (let h = 0; h < 24; h++) {
                for (let m = 0; m < 60; m += 10) {
                    let hour = h.toString().padStart(2, '0');
                    let minute = m.toString().padStart(2, '0');
                    let timeString = `${hour}:${minute}`;
                    
                    let option = document.createElement('option');
                    option.value = timeString;
                    option.text = timeString;
                    
                    if (timeString === defaultTime) {
                        option.selected = true;
                    }
                    selectElement.appendChild(option);
                }
            }
        }

        // 함수 실행 (시작은 08:30, 끝은 18:00 기본값 설정)
        generateTimeOptions('startTime', '08:30');
        generateTimeOptions('endTime', '18:00');

        window.login = () => {
            const pw = document.getElementById('loginPw').value;
            if (pw === '2258') {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                alert('비밀번호가 틀렸습니다.');
                document.getElementById('loginPw').value = '';
            }
        };

        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = '라이트모드';
            } else {
                themeBtn.textContent = '다크모드';
            }
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const date = document.getElementById('workDate').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const content = document.getElementById('workContent').value;

            if(!date || !startTime || !endTime || !content) {
                alert("모든 내용을 입력해주세요.");
                return;
            }

            const hours = `${startTime} ~ ${endTime}`;

            try {
                if (currentEditId) {
                    const docRef = doc(db, "workRecords", currentEditId);
                    await updateDoc(docRef, {
                        date: date,
                        hours: hours,
                        content: content
                    });
                    alert("성공적으로 수정되었습니다!");
                    resetInputForm();
                } else {
                    await addDoc(collection(db, "workRecords"), {
                        date: date,
                        hours: hours,
                        content: content,
                        timestamp: new Date()
                    });
                    alert("성공적으로 저장되었습니다!");
                    document.getElementById('workContent').value = ''; 
                }
                loadData();
            } catch (e) {
                console.error("저장 오류: ", e);
                alert("처리 중 오류가 발생했습니다.");
            }
        });

        async function loadData() {
            const q = query(collection(db, "workRecords"), orderBy("date", "desc"));
            const querySnapshot = await getDocs(q);
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';

            querySnapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const tr = document.createElement('tr');
                
                tr.innerHTML = `
                    <td>${data.date}</td>
                    <td>${data.hours}</td>
                    <td>${data.content}</td>
                    <td class="print-only"></td>
                    <td class="no-print">
                        <button class="btn-edit" onclick="editRecord('${documentSnapshot.id}', '${data.date}', '${data.hours}', '${data.content}')">수정</button>
                        <button class="btn-delete" onclick="deleteRecord('${documentSnapshot.id}')">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.editRecord = (id, date, hours, content) => {
            const pw = prompt("수정하려면 비밀번호를 입력하세요.");
            if (pw === '2258') {
                document.getElementById('workDate').value = date;
                const [st, et] = hours.split(' ~ ');
                document.getElementById('startTime').value = st || '08:30';
                document.getElementById('endTime').value = et || '18:00';
                document.getElementById('workContent').value = content;

                currentEditId = id;
                document.getElementById('saveBtn').textContent = '수정 완료';
                document.getElementById('saveBtn').style.background = '#ffc107';
                document.getElementById('saveBtn').style.color = 'black';
                document.getElementById('cancelEditBtn').style.display = 'block'; 
                
                window.scrollTo(0, 0); 
            } else if (pw !== null) {
                alert("비밀번호가 일치하지 않습니다.");
            }
        };

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            resetInputForm();
        });

        function resetInputForm() {
            currentEditId = null;
            document.getElementById('saveBtn').textContent = '확인 (저장)';
            document.getElementById('saveBtn').style.background = '#28a745';
            document.getElementById('saveBtn').style.color = 'white';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('workContent').value = '';
            document.getElementById('workDate').valueAsDate = new Date();
            
            // 폼 초기화 시 시간도 기본값으로 복귀
            document.getElementById('startTime').value = '08:30';
            document.getElementById('endTime').value = '18:00';
        }

        window.deleteRecord = async (id) => {
            const pw = prompt("삭제하려면 비밀번호를 입력하세요.");
            if (pw === '2258') {
                if(confirm("정말 삭제하시겠습니까?")) {
                    await deleteDoc(doc(db, "workRecords", id));
                    loadData();
                }
            } else if (pw !== null) {
                alert("비밀번호가 일치하지 않습니다.");
            }
        };

        loadData();
    </script>
</body>
</html>
